name: Refresh package latest tag
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-commanders-table
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh latest without rebuilding or changing its image
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${IMAGE_OWNER,,}/commanders-table"
          digest="$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools create --tag "$image:latest" "$image@$digest"
          after="$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')"
          test "$after" = "$digest"
          printf 'Refreshed `%s:latest` with its unchanged digest `%s`.\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
