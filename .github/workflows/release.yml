name: Publish release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-commanders-table
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-release.mjs
  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve image name
        id: image
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${IMAGE_OWNER,,}/commanders-table" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=stable,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
      - name: Publish downloads and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          if [[ -f "docs/releases/$RELEASE_TAG.md" ]]; then
            cp "docs/releases/$RELEASE_TAG.md" "$notes"
          else
            printf "# Commander's Table %s\n\n" "$RELEASE_TAG" > "$notes"
          fi
          printf '\n## Docker image\n\n`docker pull %s:%s`\n\nDigest: `%s@%s`\n\nDownload `compose.yaml` and `docker.env.example` below. Copy `docker.env.example` to `.env` and set `PUBLIC_ORIGIN` to the address your phones will open. See the [Docker guide](https://github.com/%s/blob/%s/docs/deployment.md) for installation and updates.\n' "$IMAGE_NAME" "${RELEASE_TAG#v}" "$IMAGE_NAME" "$IMAGE_DIGEST" "$GH_REPO" "$RELEASE_TAG" >> "$notes"
          release_options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then release_options+=(--prerelease --latest=false); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Commander's Table $RELEASE_TAG" --notes-file "$notes" "${release_options[@]}"
          fi
          cp .env.docker.example "$RUNNER_TEMP/docker.env.example"
          gh release upload "$RELEASE_TAG" compose.yaml "$RUNNER_TEMP/docker.env.example" --clobber
