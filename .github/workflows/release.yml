name: Publish release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-commanders-table
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-release.mjs
  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve image name
        id: image
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${IMAGE_OWNER,,}/commanders-table" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=Command Table
            org.opencontainers.image.description=A Magic life counter for one device or shared rooms
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=stable,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
      - name: Publish latest for the package install command
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          # A separate index makes latest the package page's default tag while
          # retaining the exact platform images and versioned release digest.
          docker buildx imagetools create \
            --annotation 'index:org.opencontainers.image.ref.name=latest' \
            --tag "$IMAGE_NAME:latest" \
            "$IMAGE_NAME@$IMAGE_DIGEST"
      - name: Publish downloads and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          pull_tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then pull_tag="${RELEASE_TAG#v}"; fi
          printf '# Command Table %s\n\n## Install with Docker\n\nDocker is the recommended way to host Command Table, including on your own hardware.\n\n```sh\ndocker pull %s:%s\n```\n\n' "$RELEASE_TAG" "$IMAGE_NAME" "$pull_tag" > "$notes"
          printf 'Install [Docker with Compose](https://docs.docker.com/compose/install/), then download [compose.yaml](https://github.com/%s/releases/download/%s/compose.yaml) and [docker.env.example](https://github.com/%s/releases/download/%s/docker.env.example) into the same folder. Copy `docker.env.example` to `.env`, set `PUBLIC_ORIGIN` to the exact address your phones will open, and set the image line to:\n\n```dotenv\nMTG_IMAGE=%s:%s\n```\n\n' "$GH_REPO" "$RELEASE_TAG" "$GH_REPO" "$RELEASE_TAG" "$IMAGE_NAME" "$pull_tag" >> "$notes"
          cat >> "$notes" <<'DOCKER_INSTRUCTIONS'
          Start from that folder:

          ```sh
          docker compose -p mtg-util -f compose.yaml pull
          docker compose -p mtg-util -f compose.yaml up -d
          docker compose -p mtg-util -f compose.yaml ps
          ```

          Open the configured address in your browser. The image supports amd64 and arm64; Node.js and npm are included in the container.

          ## Update an existing Docker installation

          Back up the server data and export any important browser-local games first. Keep the same Compose project, `.env`, data volume and public origin, then run the same `pull` and `up -d` commands above. Never use `down -v` during an update: it deletes server data.

          Stable releases use `latest`; prereleases use the version shown above. Pulling downloads the image; recreating the container applies it. Updates are not automatic just because `latest` is selected. Players can use **Save & update** when prompted in the app.
          DOCKER_INSTRUCTIONS
          printf '\nSee the [Docker guide](https://github.com/%s/blob/%s/docs/deployment.md) for hardware setup, HTTPS, backups and restoration.\n\n## What changed\n\n' "$GH_REPO" "$RELEASE_TAG" >> "$notes"
          if [[ -f "docs/releases/$RELEASE_TAG.md" ]]; then
            sed '1{/^# /d;}' "docs/releases/$RELEASE_TAG.md" >> "$notes"
          fi
          printf '\n## Image details\n\nVersioned image digest: `%s@%s`\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$notes"
          release_options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then release_options+=(--prerelease --latest=false); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Command Table $RELEASE_TAG" --notes-file "$notes"
          else
            # Publish only after both installation downloads are available.
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Command Table $RELEASE_TAG" --notes-file "$notes" "${release_options[@]}"
          fi
          cp .env.docker.example "$RUNNER_TEMP/docker.env.example"
          for attempt in 1 2 3; do
            if gh release upload "$RELEASE_TAG" compose.yaml "$RUNNER_TEMP/docker.env.example" --clobber; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            sleep "$((attempt * 5))"
          done
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false "${release_options[@]}"
          fi
